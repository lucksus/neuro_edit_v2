[package]
name = "server"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
net-format = { path = "../net-format" }
proto = { path = "../proto" }
sim = { path = "../sim" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
serde_json = "1"
rhai = "1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
argon2 = "0.5.3"
sha2 = "0.11.1"
rand = "0.8.5"
rpassword = "7.5.4"

[features]
default = ["sim/cuda"]
