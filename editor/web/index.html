<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>neuro_edit v2</title>
<style>
  html, body { margin: 0; height: 100%; background: #101014; overflow: hidden; }
  #ne_canvas { width: 100%; height: 100%; display: block; }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    color: #888; font: 14px/1.5 monospace;
  }
</style>
</head>
<body>
<canvas id="ne_canvas"></canvas>
<div id="loading">checking WebGPU…</div>
<script type="module">
  // Check WebGPU BEFORE the wasm bundle loads: without it the editor
  // can't start anyway, and a clear how-to page beats a dead canvas.
  // webgpu-help.mjs is a plain ES module — no build step.
  import { boot } from './webgpu-help.mjs';
  import init from './editor.js';
  boot(() => init());
</script>
</body>
</html>
