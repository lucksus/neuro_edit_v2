[package]
name = "editor"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
net-format = { path = "../net-format" }
proto = { path = "../proto" }
sim = { path = "../sim", optional = true }
server = { path = "../server", default-features = false, optional = true }
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"], optional = true }
eframe = { version = "0.32", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "persistence"] }
egui_plot = "0.33"
glam = { version = "0.30", features = ["bytemuck"] }
serde = { version = "1", features = ["derive"] }
image = "0.25"
pollster = { version = "0.4", optional = true }
wgpu = "25"
serde_json = "1.0.154"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "3.5.2"
dirs = "7.0.0"
rfd = "0.18.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.118"
wasm-bindgen-futures = "=0.4.68"
js-sys = "=0.3.95"
web-sys = { version = "=0.3.95", features = [
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "Event",
    "BinaryType",
    "Location",
    "Window",
    "Document",
    "HtmlCanvasElement",
    "Element",
    "Navigator",
    "HtmlElement",
    "CssStyleDeclaration",
    "Blob",
    "Url",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "File",
    "FileList",
    "FileReader",
] }
getrandom = { version = "0.2", features = ["js"] }

[features]
default = ["native", "sim/cuda"]
native = ["dep:sim", "dep:server", "dep:clap", "dep:pollster"]
web = []
