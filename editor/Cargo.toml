[package]
name = "editor"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
net-format = { path = "../net-format" }
proto = { path = "../proto" }
sim = { path = "../sim" }
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.32", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "persistence"] }
egui_plot = "0.33"
glam = { version = "0.30", features = ["bytemuck"] }
serde = { version = "1", features = ["derive"] }
image = "0.25"
pollster = "0.4"
rhai = "1.20"
wgpu = "25"

[features]
default = ["sim/cuda"]
